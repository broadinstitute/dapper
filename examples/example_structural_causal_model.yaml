claim_scores:
  - id: dapper:ClaimScore.BqLSbdE-5KFQhEmY_hGLUNHOYyu537l2
    score_kind: EFFECT_ESTIMATE
    value: 0.096
    metric: risk_difference
    interpretation: Natural indirect effect of setting X to 1 rather than 0, on the risk-difference scale, computed by numerical integration from the model as written. With X set, 0.6 * e_M + 0.4 * U is normal with variance 0.52, so the effect is E[expit(-0.52 + Z)] - E[expit(-1 + Z)].
