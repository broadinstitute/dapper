# Synthetic structural causal model: no data, analysis or biology is asserted.
# X affects Y directly and through M; an unmeasured U causes both X and Y, so
# it is an explicit latent variable with ordinary causal links. The estimand
# is the natural indirect effect of X on Y through M; one Claim gives its
# value, computed from the model as written (tests/test_scm.py recomputes it).
