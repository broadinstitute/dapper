structural_causal_models:
  - id: dapper:StructuralCausalModel.b500wFLFC-OzQQOEgePVVyWG0A8ImAJq
    name: Synthetic mediation model with a latent confounder
    description: X affects Y directly and through M; latent U causes X and Y.
    scope: A synthetic population; no real system is modeled.
    variables:
      - dapper:CausalVariable.jsaYiun3syKloXm4eNT6SWGPlZ9bwzGk
      - dapper:CausalVariable.yg2iRvShA_GPx9WUJL6fIunFnneoLsKI
      - dapper:CausalVariable.hVDVBGFKMeMIACJY0Aws_UzPWuWLR1jY
      - dapper:CausalVariable.Jm9PYapccyVUOLSxv4R1SWTxl-EhXI0x
    links:
      - link: dapper:CausalLink.cQUt5qJ-UXt8Gt-gyr7OsXYpiCqQyabT
        link_type: DIRECT
      - link: dapper:CausalLink.GOVKSoVP2QwR-CkSqy5dQ7Je1jBzwSSo
        link_type: DIRECT
      - link: dapper:CausalLink.ydsT-FLGWHfDFRlLT2CZ4s2fXORTa_mw
        link_type: DIRECT
      - link: dapper:CausalLink.gZbse76wZ-s7UFegfyYcLaGsoHl3-tJR
        link_type: DIRECT
      - link: dapper:CausalLink.Ry4A2p95EN3oneszdyt_LE1-u8R63mfR
        link_type: DIRECT
    variable_specifications:
      - variable: dapper:CausalVariable.jsaYiun3syKloXm4eNT6SWGPlZ9bwzGk
        domain: CONTINUOUS
        observed: false
        distribution:
          family: NORMAL
          parameters:
            - symbol: mean
              value: 0.0
            - symbol: sd
              value: 1.0
      - variable: dapper:CausalVariable.yg2iRvShA_GPx9WUJL6fIunFnneoLsKI
        domain: CONTINUOUS
      - variable: dapper:CausalVariable.hVDVBGFKMeMIACJY0Aws_UzPWuWLR1jY
        domain: CONTINUOUS
      - variable: dapper:CausalVariable.Jm9PYapccyVUOLSxv4R1SWTxl-EhXI0x
        domain: BINARY
        levels: [absent, present]
    equations:
      - outcome: dapper:CausalVariable.yg2iRvShA_GPx9WUJL6fIunFnneoLsKI
        inputs: [dapper:CausalVariable.jsaYiun3syKloXm4eNT6SWGPlZ9bwzGk]
        functional_form: LINEAR
        expression: X = a * U + e_X
        parameters:
          - symbol: a
            value: 0.5
        noise:
          family: NORMAL
          parameters:
            - symbol: mean
              value: 0.0
            - symbol: sd
              value: 1.0
      - outcome: dapper:CausalVariable.hVDVBGFKMeMIACJY0Aws_UzPWuWLR1jY
        inputs: [dapper:CausalVariable.yg2iRvShA_GPx9WUJL6fIunFnneoLsKI]
        functional_form: LINEAR
        expression: M = b * X + e_M
        parameters:
          - symbol: b
            value: 0.8
        noise:
          family: NORMAL
          parameters:
            - symbol: mean
              value: 0.0
            - symbol: sd
              value: 1.0
      - outcome: dapper:CausalVariable.Jm9PYapccyVUOLSxv4R1SWTxl-EhXI0x
        inputs: [dapper:CausalVariable.hVDVBGFKMeMIACJY0Aws_UzPWuWLR1jY, dapper:CausalVariable.jsaYiun3syKloXm4eNT6SWGPlZ9bwzGk, dapper:CausalVariable.yg2iRvShA_GPx9WUJL6fIunFnneoLsKI]
        functional_form: LOGISTIC
        expression: logit P(Y = present) = c0 + c1 * M + c2 * X + c3 * U
        parameters:
          - symbol: c0
            value: -1.0
          - symbol: c1
            value: 0.6
          - symbol: c2
            value: 0.3
          - symbol: c3
            value: 0.4
causal_estimands:
