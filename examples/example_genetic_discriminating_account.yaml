# Illustrative account, invented to exercise the schema: no data, analysis or
# biology is asserted, and the variant, estimate and genes are placeholders.
# A risk allele lowers a gene's expression in colon (a GeneticAssociation from
# an eQTL study, read causally by a CausalLink from the GenotypeVariable). Two
# rival hypotheses say how lower expression would raise disease risk: through
# epithelial barrier integrity, or through immune activation. The barrier step
# is untested (an UNTESTED claim, an identified gap), and a knockout
# experiment in colon epithelial cells discriminates the two hypotheses.
