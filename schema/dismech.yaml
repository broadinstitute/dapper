id: https://broadinstitute.github.io/dapper/model/schema/dismech.yaml
name: dapper_dismech
title: DAPPER DISMECH correspondence
description: >-
  Optional correspondence to the Monarch Initiative DISMECH
  disease-pathophysiology schema (https://w3id.org/monarch-initiative/dismech).
  `CorrespondsToDismech` specializes the core `CorrespondsTo` edge with the
  fields a DISMECH entry needs. Nothing else in DAPPER depends on this
  module: class-level parity is recorded as `close_mappings` on the classes
  themselves, and DAPPER owns its own names and structure.
license: https://opensource.org/license/mit
version: 0.3.0-a1

default_prefix: dapper
default_range: string

prefixes:
  dapper: https://broadinstitute.github.io/dapper/ns#
  dapper_class: https://broadinstitute.github.io/dapper/model/reference/classes/
  dapper_slot: https://broadinstitute.github.io/dapper/model/reference/slots/
  dapper_enum: https://broadinstitute.github.io/dapper/model/reference/enums/
  dapper_type: https://broadinstitute.github.io/dapper/model/reference/types/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#

imports:
  - linkml:types
  - core

# ===========================================================================
# DISMECH CORRESPONDENCE
#
# DISMECH is an independent upstream model; DAPPER does not edit or mirror it.
# The two line up at two levels, and neither creates a dependency:
#
#   Class level (parity). `close_mappings: dismech:...` on DAPPER classes and
#   slots, e.g.
#     dapper:Dataset             ~ dismech:Dataset   (DISMECH describes the
#                                  science of a dataset, DAPPER its attribution)
#     dapper:Publication         ~ dismech:PublicationReference
#     dapper:Activity            ~ dismech:CurationEvent
#     dapper:MechanisticModel    ~ dismech:MechanisticHypothesis
#     dapper:CausalStep          ~ dismech:CausalEdge
#     dapper:Mechanism           ~ dismech:Mechanism, dismech:Pathophysiology
#     dapper:EvidenceItem        ~ dismech:EvidenceItem
#   Where a DAPPER structure currently matches DISMECH's (CausalLinkTypeEnum,
#   the CausalStep fields, EvidenceItem's field names), that is a starting
#   point, not a contract: DAPPER owns the names and may diverge.
#
#   Instance level (optional). A `CorrespondsToDismech` edge from a DAPPER
#   node to the DISMECH entry. Edges are not part of a node's identity, so
#   adding, changing or removing a correspondence never changes a DAPPER id.
#
# NOTE ON KEYS. DISMECH keys a disease by `Disease.name` (a plain string).
# Point the edge's `object` at the ontology term the entry carries (the MONDO
# CURIE), and record the upstream string key in `entry_key` so the join is
# lossless in both directions.
# ===========================================================================

# ===========================================================================
# CLASSES
# ===========================================================================
classes:
  CorrespondsToDismech:
    is_a: CorrespondsTo
    description: >-
      Any DAPPER node → the DISMECH entry it corresponds to. Adds the DISMECH
      class, the upstream string key and a review link to the core
      correspondence edge.
    slot_usage:
      object:
        description: >-
          Resolvable identifier of the DISMECH entry; prefer the MONDO CURIE
          of its disease (DISMECH `Disease.disease_term`).
    attributes:
      dismech_class:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        description: >-
          CURIE of the DISMECH class the subject corresponds to, e.g.
          `dismech:MechanisticHypothesis`.
      entry_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The upstream DISMECH string key for the entry: `Disease.name` for a
          disease, `hypothesis_group_id` for a mechanistic hypothesis. DISMECH
          uses plain strings as identifiers, so this is NOT a CURIE.
      source_url:
        is_a: literal
        mixins: [hashable]
        range: uri
        description: >-
          Deep link to the entry on https://dismech.monarchinitiative.org, for
          human review.
