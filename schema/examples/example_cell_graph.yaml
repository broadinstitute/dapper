# A minimal graph-shaped DAPPER document, preloaded by the portal alongside
# the geneset and claim-provenance graphs. Same GeneProgram/CellState
# instances as example_gene_program.yaml and example_cell_state.yaml —
# EXTRACTED verbatim, same ids — but wrapped in the group-keyed shape the
# portal (and mint.py) expect (`gene_programs:` / `cell_states:` lists),
# rather than bare single-instance documents. This is a reference document
# (mixed classes), not a single-class instance; validate the individual
# nodes with `linkml-validate -C <ClassName>` if desired.
#
# Both nodes are illustrative — neither is transcribed from a real pipeline
# run, unlike the geneset graph — so both are listed below. The CellState
# content is a real curated record (pancreatic ductal epithelial identity);
# the GeneProgram is real NMF loading output (Factor_1 of a gene-by-program
# matrix). The pairing between them is illustrative only, to exercise
# `has_program` and `member_weights` together — not a biological claim that
# this factor constitutes ductal identity.

_illustrative:
  - dapper:GeneProgram.o0deHnx9sf6jKFsLq24y1ZpP2cmCqxI4
  - dapper:CellState.IrgqH1icla6iIPI_xTyJPODa4V-qmGvj

