# A minimal graph-shaped DAPPER document, preloaded by the portal alongside
# the geneset and claim-provenance graphs. Same GeneProgram/CellState
# instances as example_gene_program.yaml and example_cell_state.yaml, but
# wrapped in the group-keyed shape the portal (and mint.py) expect
# (`gene_programs:` / `cell_states:` lists), rather than a bare single-
# instance document. This is a reference document (mixed classes), not a
# single-class instance; validate the individual nodes with
# `linkml-validate -C <ClassName>` if desired.
#
# Both nodes are illustrative — neither is transcribed from a real pipeline
# run, unlike the geneset graph — so both are listed below. The CellState
# content is a real curated record (pancreatic ductal epithelial identity),
# used to show the internal cell-state marker-curation schema fields in use;
# the GeneProgram is illustrative filler for the marker panel it names.

_illustrative:
  - dapper:GeneProgram.8n58-QNe-CAgQ9fTDyXUsMeKOU4dJGDd
  - dapper:CellState.q_1MTMlGQ-VXlTkoHmlUEDNSJS7wyid5

gene_programs:
  - id: dapper:GeneProgram.8n58-QNe-CAgQ9fTDyXUsMeKOU4dJGDd
    name: Ductal epithelial identity marker panel
    description: >-
      Curated pancreatic ductal epithelial marker panel used to score ductal
      identity.
    member_type: gene
    n_genes: 10
    organism: human
    inference_method: curated

cell_states:
