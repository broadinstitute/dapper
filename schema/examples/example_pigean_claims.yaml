# DAPPER Claim / CompositeClaim: the user's PIGEAN sentence.
# Entirely illustrative: no analysis was run, no numbers are empirical, and
# demo_*.py commands are schematic stand-ins for commands captured from real runs.
# P1=0.82, P2=0.67, P3=0.74 stand in for the user's probability variables.
# They are NOT source PIGEAN/EAGGL metric names or a conversion of real weights.
# Gene A, Trait T, Factor C, software URNs and predicates are example identifiers.
# Factor C is scoped to its fitted analysis; its definition resides in the factor output.
# Every DAPPER node id below was minted using DAPPER-ID-1, not authored by hand.
# See ../docs/claims.md for semantics, the mapping, and validation instructions.

