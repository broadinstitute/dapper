  subject_entity: urn:example:gene:A
  relation: urn:example:associatedWith
  object_entity: urn:example:trait:T
  scope: Trait T; no tissue restriction is inferred from the gene-set input.
- id: dapper:Proposition.cjh_TVboFrtif5fhQySXq74ThXuuVe3G
  name: geneset trait
  statement: GeneSet B predicts trait-relevant genes for Trait T.
  subject_entity: dapper:GeneSet.nm1OIRfiEuPJP_GBfzVGhbKGumvDgXr_
  relation: urn:example:predictsTraitRelevantGenesFor
  object_entity: urn:example:trait:T
  scope: Trait T; annotation relevance, not a claim of biological mediation.
- id: dapper:Proposition.2Aq9J2ah8MdGCNmrKokmxWcjdS4aX_8w
  name: geneset factor
  statement: GeneSet B is a possible readout of latent Factor C in the Trait T fit.
  subject_entity: dapper:GeneSet.nm1OIRfiEuPJP_GBfzVGhbKGumvDgXr_
  relation: urn:example:possibleReadoutOf
  object_entity: urn:example:eaggl-fit-1:trait-T:factor-C
  scope: Trait T; Factor C belongs only to the illustrative EAGGL fit identified by its URI. No named
    biological mechanism is asserted.
- id: dapper:Proposition.Ndks7xEMDAFg7TnjeWtvlEAIIXVk7Ij-
  name: Combined annotation-based explanation
  statement: Gene A is associated with Trait T, with an annotation-based explanation through GeneSet B,
    which contains Gene A, predicts trait-relevant genes, and is a possible readout of latent Factor C
    in the Trait T fit.
  scope: Via refers to an annotation-based explanation. It does not assert biological mediation, establish
    a causal mechanism, or identify the fitted factor with a known mechanism.
