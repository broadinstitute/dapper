# THE BRIDGE. This is the node that makes a claim traceable to raw files.
#
# Note the contrast between the two provenance graphs below. The enrichment
# claim was GENERATED BY A MACHINE, so its provenance points at an Activity and
# from there into the C2M2 file graph. The composite hypothesis was ARGUED BY A
# PERSON from published evidence, so its provenance has no activity at all — it
# points at the nanopub that supports it and at the literature. Both are valid
# provenance; they just answer "where did this come from?" differently.
nanopub_provenances:
  - id: dapper:NanopubProvenance.YFQrbw8L3AWEQd_riveyKvlOhALve1uD
    name: Provenance — where the claim came from
