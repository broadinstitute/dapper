# NIH-DAPP 3.0 — a claim traced ALL THE WAY BACK to the C2M2 files it rests on.
#
# This is example_geneset_graph.yaml extended past the gene set: it keeps going
# through the analysis that consumed the gene set, to the claim that analysis
# produced, to the signed nanopublication that published the claim, to the
# hypothesis that claim supports.
#
#   C2M2 files
#     -> [Activity: hubmap_asctb_augmented]      prov:used / prov:wasGeneratedBy
#       -> unsigned_term_gene.tsv
#         -> [Activity: unsigned_term_gene converter]
#           -> GeneSet 402cf4a1f3682a2e5bf1b002
#             -> [Activity: REVEAL enrichment]
#               -> Hypothesis (atomic claim: PT marker enrichment)
#                 -> Nanopublication (signed; assertion = that claim)
#                   -> supports Hypothesis (composite: CLCN5 -> PT dysfunction -> Dent disease)
#
# THE POINT. The nanopub's provenance graph and the dig.geneset C2M2 provenance
# graph are THE SAME GRAPH — `NanopubProvenance.generated_by_activity` lands on
# an `Activity` that is already wired to C2M2 files by the `Used` /
# `WasGeneratedBy` edges the converter emits. Nothing bridges the two worlds
# because there are not two worlds. Traversal from a claim to its raw files is:
#
#   Hypothesis.supported_by_nanopub
#     -> Nanopublication.has_provenance
#       -> NanopubProvenance.generated_by_activity        (and .derived_from)
#         -> Used edges (prov:used)  -> C2M2File
#
# WHAT IS REAL vs ILLUSTRATIVE
#   REAL, transcribed from tests/fixtures/geneset-hubmap-hz2/geneset.provenance.json:
#     every c2m2_file, the two activities, the gene set node, and all the
#     used/was_generated_by edges among them. Same values as
#     example_geneset_graph.yaml.
#   ILLUSTRATIVE (marked inline): the downstream REVEAL enrichment activity,
#     the claim, the nanopublication, and the composite hypothesis. No such
#     analysis has been run; the shape is what is being demonstrated.
#
# Ontology CURIEs were resolved live before being written (EBI OLS4 / HGNC):
#   MONDO:0015612  Dent disease ("proximal tubule dysfunction")
#   CL:0002306     epithelial cell of proximal tubule
#   HGNC:2023      CLCN5
#
# Reference document (mixed node/edge types), like example_geneset_graph.yaml —
# validate individual nodes with `linkml-validate -C <ClassName>`.

