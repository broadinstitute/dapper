    has_signature_element: dapper:NanopubSignature.VflWc_Nf8F2KZNzQf7MGzQUgUuU9c-p8

  # The composite hypothesis gets its own nanopub too — this is the
  # `asserted_in` direction. Note it is a SEPARATE nanopub from the supporting
  # one: publishing a hypothesis and supporting a hypothesis are different
  # acts, by potentially different people, at different times.
  - id: dapper:Nanopublication.7hjuQGdQssbfOTGnBs-5UMm0zfcfk-Lt
    name: "Hypothesis: CLCN5 loss of function causes Dent disease via proximal tubule dysfunction"
