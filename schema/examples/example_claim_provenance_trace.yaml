    has_assertion: dapper:NanopubAssertion.EPdqQ2NXk75MnJq4D9u2YPW_alTP657u
    has_provenance: dapper:NanopubProvenance.-xpKAWPK7lI3pTIl0rgjCVvW09bsvI5P
    has_publication_info: dapper:NanopubPublicationInfo.-I-hMLIwXIOIFBF_exGTDdMqIUqVhEYn
