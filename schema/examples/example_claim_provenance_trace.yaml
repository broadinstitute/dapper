# ===========================================================================
# ILLUSTRATIVE — the claim, as an ATOMIC Hypothesis.
#
# Per the schema's design note: a claim IS a hypothesis, just an atomic one.
# There is no separate Claim class. What makes this one "supporting evidence"
# rather than "the conclusion" is only its position in the graph.
#
# Note `was_generated_by` and `was_derived_from`: these come from the
# ProvenancedResource mixin, the SAME slots a Dataset uses. That is the join —
# the claim points back into the analysis DAG using the ordinary provenance
# vocabulary, so no special traversal is needed.
# ===========================================================================
hypotheses:
  - id: dapper:Hypothesis.6dwuSUM4kkq9mpthBu2Mh6BmCV0P-m8x
    name: Proximal tubule marker genes are enriched among Dent disease genes
    hypothesis_label: HuBMAP PT markers enriched in Dent disease
    statement: >-
      The HuBMAP ASCT+B marker gene set for epithelial cells of the proximal
      tubule is enriched among genes implicated in Dent disease.
    status: proposed
    confidence: 0.78
    subject_entity: CL:0002306
    object_entity: MONDO:0015612
    object_disease: MONDO:0015612
    # provenance back into the analysis DAG — ProvenancedResource slots
    was_generated_by: dapper:Activity.csp048YWkBPkx31lMT1pR85uFX4JLJ4d
    was_derived_from:
      - dapper:GeneSet.0dj0poPIUTC8EFQxG5p52jO554zJB6gZ
    access_level: public
    has_license: https://creativecommons.org/licenses/by/4.0/
    asserted_in:
      - dapper:Nanopublication.VLib_zcd4SSTr8Y1ivf_iVZj7VgHIkpX

  # ILLUSTRATIVE — the composite hypothesis the atomic claim supports.
  # This is the REVEAL-shaped gene -> mechanism -> disease object; the
  # enrichment claim above is one leg of its support.
  - id: dapper:Hypothesis.2gJtc58y4jV1ZcZexmAca2YFAyCsR2MJ
    name: CLCN5 loss of function causes Dent disease via proximal tubule dysfunction
    hypothesis_label: CLCN5 LOF -> PT dysfunction -> Dent disease
    statement: >-
      Loss-of-function variants in CLCN5 impair endosomal acidification in
      proximal tubule epithelial cells, causing the proximal tubule dysfunction
      that manifests as Dent disease.
    status: canonical
    subject_entity: HGNC:2023
    subject_gene: HGNC:2023
    object_entity: MONDO:0015612
    object_disease: MONDO:0015612
    dismech_class: dismech:MechanisticHypothesis
    dismech_disease_term: MONDO:0015612
    access_level: public
    # the two directions, kept distinct
    supported_by_nanopub:
      - dapper:Nanopublication.VLib_zcd4SSTr8Y1ivf_iVZj7VgHIkpX
    asserted_in:
      - dapper:Nanopublication.7hjuQGdQssbfOTGnBs-5UMm0zfcfk-Lt

# ===========================================================================
# ILLUSTRATIVE — the nanopublication publishing the atomic claim.
#
# Its provenance graph is where the trace crosses back into the C2M2 world:
# `generated_by_activity` is the REVEAL Activity, and `derived_from` names the
# gene set and the C2M2 file. Both are already nodes in the DAG above.
# ===========================================================================
nanopublications:
  - id: dapper:Nanopublication.VLib_zcd4SSTr8Y1ivf_iVZj7VgHIkpX
    name: "Claim: HuBMAP proximal tubule markers are enriched among Dent disease genes"
    label: PT marker enrichment in Dent disease
    has_assertion: dapper:NanopubAssertion.x6P_QpSIKWWO23d7BoBP7HOlL0yGIERi
    has_provenance: dapper:NanopubProvenance.YFQrbw8L3AWEQd_riveyKvlOhALve1uD
    has_publication_info: dapper:NanopubPublicationInfo.6a4hNgtNOBllXBFNOj9sixyn7Afw3qjw
    nanopub_type:
