    # who asserted it — a software agent, since REVEAL generated it
    was_attributed_to:
      - orcid:0000-0002-1825-0097
    # ---> lands directly on a node of the dig.geneset provenance DAG
    generated_by_activity: dapper:Activity.csp048YWkBPkx31lMT1pR85uFX4JLJ4d
    derived_from:
      - dapper:GeneSet.0dj0poPIUTC8EFQxG5p52jO554zJB6gZ
      - dapper:C2M2File.lrxz_mf5zFwFtA16CBJZBjS2khG6ol5I

  - id: dapper:NanopubProvenance.-xpKAWPK7lI3pTIl0rgjCVvW09bsvI5P
    name: Provenance — where the claim came from
    provenance_of: dapper:NanopubAssertion.EPdqQ2NXk75MnJq4D9u2YPW_alTP657u
    # a curated claim: attributed to a person, with no generating activity
    was_attributed_to:
