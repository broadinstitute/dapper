# ===========================================================================
# Analyses. First two REAL; the third ILLUSTRATIVE (the REVEAL step).
# ===========================================================================
activities:
  - id: dapper:Activity.mtSuYybAWDkBNBheeH_vAwiwl3AEvbaV
    name: prepare_hubmap_unsigned_term_gene
    activity_type: workflow
    entrypoint: geneset-extractors workflows hubmap_asctb_augmented
    repo_url: https://github.com/flannick/dig-gene-set-extractors
    code_version: 2fb57130136a8fa25211ef1e77fe13d220e4b115
    has_agentic_workspace:
      - dapper:AgenticWorkspace.UuODSZn36qaMLirzvexGGauD-PwSl_EN

  - id: dapper:Activity.fGorLVztQOsGuaZA8B3KVxMRj4GWcx1L
    name: generate_402cf4a1f3682a2e5bf1b002
    activity_type: converter_invocation
    entrypoint: geneset-extractors convert unsigned_term_gene
    repo_url: https://github.com/flannick/dig-gene-set-extractors
    code_version: 2fb57130136a8fa25211ef1e77fe13d220e4b115
    has_agentic_workspace:
      - dapper:AgenticWorkspace.UuODSZn36qaMLirzvexGGauD-PwSl_EN

  # ILLUSTRATIVE — the analysis that turns the gene set into a claim. This is
  # the step that has no counterpart in dig.geneset today, and it is modelled
  # with exactly the same Activity class as the converter steps above, so it
  # joins the existing provenance DAG rather than starting a new one.
  - id: dapper:Activity.csp048YWkBPkx31lMT1pR85uFX4JLJ4d
    name: reveal_enrichment_dent_disease
    activity_type: enrichment_analysis
    entrypoint: reveal enrichment
    command: >-
      reveal enrichment --geneset dapper:GeneSet.0dj0poPIUTC8EFQxG5p52jO554zJB6gZ
      --disease MONDO:0015612 --method fishers-exact --fdr 0.05
    # quoted: an unquoted all-digit SHA is parsed by YAML as an integer
    code_version: "<reveal-git-sha>"
    generated_at_time: "2026-08-04T20:00:00Z"
    # the agentic replay path — see agentic_workspaces below
    has_agentic_workspace:
      - dapper:AgenticWorkspace.437GE1YwXUCUgO1cM1DFBmf98uPnko0_

# ===========================================================================
# ILLUSTRATIVE — how to re-run the analysis with an agent.
#
# The Activity above already carries the MACHINE replay path (`command`,
# `code_version`, and in a real run `container_image`). This is the AGENTIC one:
# a workspace an agent can open and a self-contained prompt asking it to redo
# the analysis. The two sit alongside each other because they answer different
# questions — "how do I reproduce this exactly?" versus "how do I ask for this
# to be done again?"
#
# The fork slug and prompt below are illustrative — no such fork exists yet.
#
# NOT a determinism guarantee. Re-running a prompt yields a NEW Activity, which
# may differ from the original. `agent_model` is recorded so a divergence can at
# least be explained. For bit-identical replay, use `command` +
# `container_image` + `code_version` on the Activity.
# ===========================================================================
agentic_workspaces:
  - id: dapper:AgenticWorkspace.UuODSZn36qaMLirzvexGGauD-PwSl_EN
    name: dig-gene-set-extractors — HuBMAP HZ2
    platform: akleao
    workspace_url: https://www.akleao.com/fork/dig-geneset-hubmap-hz2
    workspace_key: dig-geneset-hubmap-hz2
    agent_model: claude-fable-5
    regeneration_prompt: >-
      Regenerate HuBMAP gene-set library 402cf4a1f3682a2e5bf1b002 (ASCT+B
      augmented markers, model HZ2, human, hg38) by re-running both steps of
      the dig-gene-set-extractors pipeline pinned to commit
      2fb57130136a8fa25211ef1e77fe13d220e4b115.

      Step 1 — `geneset-extractors workflows hubmap_asctb_augmented`: take the
      released ASCT+B marker table (gene_attribute_matrix.txt.gz) and NCBI
      human_gene_info as inputs, with augmentation_threshold 0.67 and
      cap_multiplier 4. It should emit hubmap_unsigned_term_gene.tsv and
      asctb_geneshot_augmented_genes.tsv.

      Step 2 — `geneset-extractors convert unsigned_term_gene` over that table,
      with emit_small_gene_sets false, gene_id_column gene_id,
      gene_symbol_column gene_symbol, gmt_min_genes 5, score_column score,
      term_column term, term_prefix HuBMAP. It should emit the gene set plus
      genesets.gmt, geneset.tsv, geneset.full.tsv, signature_summary.tsv and
      geneset.meta.json.

      Record each step as a NEW Activity with its own C2M2 file outputs and
      checksums. Do not overwrite the existing provenance. Then compare the
      regenerated checksums against the originals and report any that differ —
      a divergence is a finding, not a failure to hide.

  - id: dapper:AgenticWorkspace.437GE1YwXUCUgO1cM1DFBmf98uPnko0_
    name: REVEAL enrichment — Dent disease
    platform: akleao
    # an agentic workspace is a FORK — one shareable slug, not a project/branch path
    workspace_url: https://www.akleao.com/fork/reveal-enrichment-dent
    workspace_key: reveal-enrichment-dent
    agent_model: claude-fable-5
    last_run: "2026-08-04T20:00:00Z"
    regeneration_prompt: >-
      Re-run the REVEAL enrichment for Dent disease. Load gene set
      dapper:GeneSet.0dj0poPIUTC8EFQxG5p52jO554zJB6gZ (HuBMAP ASCT+B augmented marker library,
      model HZ2, human/hg38) from its C2M2 provenance. Test each named marker
      set for over-representation among genes implicated in Dent disease
      (MONDO:0015612) using Fisher's exact test with Benjamini-Hochberg FDR at
      0.05. Report every set reaching significance with its odds ratio, raw and
      adjusted p-values, and overlapping genes. Emit the result as a NIH-DAPP
      Hypothesis whose subject_entity is the enriched cell type and whose
      object_disease is MONDO:0015612, and record this run as a new Activity —
      do not overwrite the existing one.

