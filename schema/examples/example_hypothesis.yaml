id: dapper:Hypothesis.Rd6eO_OEsWNyQvxwWY-MSd5ChEvSKVTg
name: PCSK9 gain-of-function drives familial hypercholesterolemia via LDLR degradation
hypothesis_label: PCSK9 GOF -> LDLR degradation -> FH

statement: >-
  Gain-of-function variants in PCSK9 increase degradation of the hepatic LDL
  receptor, which reduces clearance of circulating LDL cholesterol and causes
  familial hypercholesterolemia.

description: >-
  PCSK9 binds the EGF-A domain of the LDL receptor at the hepatocyte surface and
  redirects the receptor to the lysosome instead of the recycling endosome.
  Gain-of-function variants raise the rate of that diversion, lowering steady-state
  surface LDLR density and therefore hepatic LDL-C clearance. The mechanism is
  supported in the causal direction by loss-of-function variants producing the
  mirror-image phenotype and by the therapeutic effect of PCSK9 inhibition.

