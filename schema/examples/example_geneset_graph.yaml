#   "data input"  -> Used   (prov:used;         edge_role: data_input)
#   "data output" -> WasGeneratedBy (prov:wasGeneratedBy)
#
# Everything here is transcribed from the real provenance EXCEPT the
# `agentic_workspaces` block near the bottom, which is illustrative and marked
# as such — dig.geneset carries no agentic workspace today.

