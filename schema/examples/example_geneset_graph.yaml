    predicate: prov:used
    object: file:human_gene_info:9202e2fa-eafc-5d12-a804-b653631f56f5
    edge_role: data_input
  - subject: analysis:unsigned_term_gene:af57f812-9a29-559a-9683-4e2c3fd79d5b
    predicate: prov:used
    object: file:unsigned_term_gene_tsv:ba2297f9-7b5a-5215-a32e-d96bfbf71170
    edge_role: data_input

