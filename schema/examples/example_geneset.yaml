# A single valid NIH-DAPP `GeneSet` node instance, derived from a REAL
# dig.geneset extraction:
#   s3://dig-gene-set-data/HuBMAP/genesets/all_signatures/models/HZ2/extractor/
# (the source fixtures are checked in under examples/geneset-hubmap-hz2/).
#
# Validate with:
#   uv run --with linkml linkml-validate \
#     -s ../dapper.yaml -C GeneSet example_geneset.yaml
#
# GeneSet is_a Set (prov:Collection) and gets its attribution/provenance/mirror
# slots from the ProvenancedResource mixin — the same slots Dataset uses — so a
# gene set is citable and mirror-protected identically to a dataset.
# Cross-references are CURIEs pointing at the nodes in example_geneset_graph.yaml.

id: geneset:402cf4a1f3682a2e5bf1b002
name: HuBMAP ASCT+B augmented marker gene-set library (model HZ2)
description: >-
  HuBMAP ASCT+B augmented marker gene-set library using model HZ2: library built
  from released ASCT+B marker tables and expanded with GeneShot-based
  augmentation under the configured enrichment threshold and cap.

# --- Set / GeneSet fields (from geneset.meta.json gene_set{} + summary{}) ---
member_type: gene
n_genes: 1747          # unique genes (summary.n_genes)
n_sets: 487            # named term→genes sets in the .gmt (summary.n_sets_emitted)
assay: bulk
data_type: transcriptomics
organism: human
genome_build: hg38
term_prefix: HuBMAP
# members are not enumerated inline (1747 genes / 487 sets); they live in the
# .gmt output artifact referenced as a C2M2File in the provenance graph.

# --- portal links (PortalLinked mixin; dig.geneset dcc_url/drc_url) ---
dcc_url: urn:geneset:402cf4a1f3682a2e5bf1b002
drc_url: urn:geneset:402cf4a1f3682a2e5bf1b002

# --- provenance (ProvenancedResource mixin) ---
# The gene set was generated by the converter Activity and derived from the
# unsigned_term_gene table produced by the upstream workflow Activity.
was_generated_by: analysis:unsigned_term_gene:af57f812-9a29-559a-9683-4e2c3fd79d5b
was_derived_from:
  - file:unsigned_term_gene_tsv:ba2297f9-7b5a-5215-a32e-d96bfbf71170

# --- authoritative attribution (mirror_mutable: false) ---
# Illustrative NIH attribution for a HuBMAP-derived resource; a mirror MUST NOT
# rewrite these (same invariant as Dataset).
has_creator:
  - ror:04j198w64                       # HuBMAP Consortium (illustrative)
funded_by:
  - nih:award/U54-HuBMAP-EXAMPLE
is_described_by:
  - nih:publication/hubmap-asctb
has_recommended_citation: nih:citation/hubmap-hz2-geneset

access_level: public
controlled_access: false

# --- mirror-appended (append-only; NOT authoritative) ---
has_mirror_provenance:
  - nih:mirror/openai-us-west-1-hubmap-hz2
