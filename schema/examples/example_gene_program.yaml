# A single GeneProgram instance — the 4.0 single-cell counterpart of
# example_geneset.yaml. Illustrative: a gene expression program of the kind
# produced by matrix factorization (cNMF/NMF/Spectra) over an scRNA-seq atlas,
# capturing a coordinated, quantitative pattern of gene activity rather than a
# curated static annotation (contrast with example_geneset.yaml).
#
#   uv run --with linkml linkml-validate \
#     -s ../dapper.yaml -C GeneProgram example_gene_program.yaml
#
# Standalone — not referenced by example_cell_state.yaml or
# example_cell_graph.yaml, which pair a curated cell state with a different
# (curated, not factorized) marker-panel GeneProgram. Kept here as a second,
# independent illustration of the class.

id: dapper:GeneProgram.5pG0ElQGWPHRAKFicy7BfsMgH8DEXTME
name: T cell activation program (cNMF factor 12)
description: >-
  Gene expression program capturing coordinated up-regulation of T-cell
  receptor signaling and early activation-marker genes.
member_type: gene
n_genes: 56
assay: scRNA-seq
organism: human
inference_method: cNMF
biological_process:
  - obo:GO_0042110      # T cell activation
