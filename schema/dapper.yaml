id: https://broadinstitute.github.io/dapper/model/schema/dapper.yaml
name: dapper
title: DAPPER - NIH Dataset Attribution and Provenance Profile
description: >-
  A LinkML data model for DAPPER, the NIH Dataset Attribution and Provenance
  Profile. Every dataset returned through an NIH MCP server should carry
  enough structured metadata for an AI system to cite the dataset, identify its
  creators, link to the primary publication, report the NIH grant/award that
  supported it, and describe the provenance of the returned result.

  This is the profile's entry point. It is assembled from three modules:

    core.yaml. The domain-neutral core: the knowledge-graph skeleton,
      identity, citation/funding/provenance (JSON-LD + DataCite + PROV-O +
      schema.org), GA4GH DRS, DUO, RO-Crate, BioCompute/IEEE-2791,
      embeddings, and versioned collections (`Collection`,
      `ResultCollection`).

    claims.yaml. `Claim` assesses a reusable Proposition with typed scores and
      execution provenance. `ScientificAccount` organizes framing, context, claims and an optional
      conclusion; `Paragraph` records a textual expression. Conceptually
      aligned with SEPIO's Proposition and Statement model.

    dapper.yaml (this file). The domain blocks:

    GENE SETS. `GeneSet` specializes the core `Set` and `GeneSetCollection`
      the core `Collection` for the dig.geneset standard; `C2M2File`
      specializes the core `File` with CFDE C2M2 identifiers.

    DISMECH HARMONIZATION. Cross-walk mappings onto the Monarch Initiative
      DISMECH disease-pathophysiology schema
      (https://w3id.org/monarch-initiative/dismech), so the two models stay
      harmonized without either one forking the other. DISMECH is mirrored
      verbatim from upstream and is NOT edited; all harmonization lives here
      as `exact_mappings` / `close_mappings` plus a `DismechLinked` mixin
      (in core.yaml) carrying pointers. Reuse, don't reinvent.

    NANOPUBLICATION. The nanopublication model as used by the Nanodash /
      Knowledge Pixels stack: the Head/assertion/provenance/pubinfo quad and
      the npx signature + lifecycle (supersedes / retracts / introduces)
      terms. Lets a DAPPER object be emitted as, or minted from, a signed
      nanopublication.

    AGENTIC REPLAY. `AgenticWorkspace` — the workspace and prompt an
      AI agent can use to re-run an `Activity`. The executable provenance an
      Activity carries (`command`, `container_image`, `code_version`) is
      the machine replay path; this is the agentic one, alongside it rather
      than instead of it. A prompt is NOT a deterministic replay mechanism,
      so the two are deliberately not interchangeable.

    MECHANISTIC MODELS. Optional biological structure in MechanisticModel,
      CausalStep and Mechanism. A hypothesis is a Proposition's role within
      ScientificAccount. Confidence, review status and evidence live on Claim.
      `EvidenceItem` can ground in a source Claim or, through the core
      `ValueLocator`, in the exact bytes of a value in a result file.

    SINGLE-CELL. `GeneProgram` — a coordinated pattern of gene activity
      representing a biological process, e.g. a factor from cNMF/NMF/
      Spectra/WGCNA or a curated gene module — extends `Set` the same way
      `GeneSet` does, with genes as members. `CellState` is the cellular
      phenotype defined by the combination of `GeneProgram`s active in a
      cell (or cell population) at once, as distinct from a cell TYPE (a
      Cell Ontology class), which is what lineage a cell belongs to rather
      than what functional state it is in.

  The schema is shaped as a Dock knowledge graph: NIH resources, agents,
  awards, publications, scientific accounts, and nanopublications are Node entities;
  attribution, provenance, and causal assertions are Edge relationships.
license: https://opensource.org/license/mit
version: 0.3.0-a1

default_prefix: dapper
default_range: string

# Shared prefixes (and the prefix policy) are declared in core.yaml; these
# are the ones this module's terms use directly.
prefixes:
  dapper: https://broadinstitute.github.io/dapper/ns#
  dapper_class: https://broadinstitute.github.io/dapper/model/reference/classes/
  dapper_slot: https://broadinstitute.github.io/dapper/model/reference/slots/
  dapper_enum: https://broadinstitute.github.io/dapper/model/reference/enums/
  dapper_type: https://broadinstitute.github.io/dapper/model/reference/types/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  np: http://www.nanopub.org/nschema#
  npx: http://purl.org/nanopub/x/
  hycl: http://purl.org/petapico/o/hycl#
  ntemplate: https://w3id.org/np/o/ntemplate/
  dismech: https://w3id.org/monarch-initiative/dismech/
  skos: http://www.w3.org/2004/02/skos/core#
  DataCite: http://purl.org/spar/datacite/
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  obo: http://purl.obolibrary.org/obo/
  rdfs: http://www.w3.org/2000/01/rdf-schema#

imports:
  - linkml:types
  - core
  - claims

# ===========================================================================
# ENUMS
# ===========================================================================
enums:
  CausalLinkTypeEnum:
    description: >-
      Directness of a causal step. Values are copied VERBATIM from DISMECH's
      `CausalLinkTypeEnum` (dismech:CausalLinkTypeEnum) so a DAPPER causal
      step round-trips into a DISMECH `CausalEdge.causal_link_type` with no
      value translation. Do not add or rename values here without changing
      them upstream first.
    exact_mappings:
      - dismech:CausalLinkTypeEnum
    annotations:
      dapper:source_standard: DISMECH CausalLinkTypeEnum
    permissible_values:
      DIRECT:
        description: The subject acts directly on the object; no intermediates.
      INDIRECT_KNOWN_INTERMEDIATES:
        description: >-
          Indirect, and the intervening mechanisms are known and should be
          listed in `intermediate_mechanisms`.
      INDIRECT_UNKNOWN_INTERMEDIATES:
        description: Indirect, but the intervening mechanisms are not known.
      UNKNOWN:
        description: Directness has not been determined.

  NanopubTypeEnum:
    description: >-
      Nanopublication subtypes from Nanopub-X (npx), used as the object of
      `npx:hasNanopubType`. Each `meaning` was read from the live npx ontology
      document at http://purl.org/nanopub/x/.
    annotations:
      dapper:source_standard: Nanopub-X (http://purl.org/nanopub/x/)
    permissible_values:
      example_nanopub:
        meaning: npx:ExampleNanopub
        description: Published for testing; content should not be taken seriously.
      draft_nanopub:
        meaning: npx:DraftNanopub
        description: Marked as work-in-progress.
      meta_nanopub:
        meaning: npx:MetaNanopub
        description: A nanopublication about other nanopublications.
      protected_nanopub:
        meaning: npx:ProtectedNanopub
        description: Not intended to be shared publicly.
      retraction_nanopub:
        meaning: npx:RetractionNanopub
        description: Retracts a previously published nanopublication.
      intro_nanopub:
        meaning: npx:IntroNanopub
        description: Introduces an agent and its public key.

# ===========================================================================
# SLOTS
# ===========================================================================
slots:
  has_gmt_file:
    is_a: relationship
    mixins: [hashable]
    range: File
    inlined: false
    slot_uri: dapper:hasGmtFile
    description: >-
      Local File or C2M2File record serializing a gene-set collection, or a
      whole-file export of a single GeneSet. Use its content-derived DAPPER
      identifier, not a bare checksum or retrieval URL. A row in a shared GMT
      is selected with GeneSet.in_gmt_file and gmt_entry instead.

# ===========================================================================
# CLASSES
# ===========================================================================
classes:

  # ======================================================================
  # BLOCK — GENE SETS. Set specializations for genes (dig.geneset).
  # ======================================================================

  GeneSet:
    is_a: Set
    aliases:
      - gene set
      - signature
    description: >-
      A Set whose members are genes (the dig.geneset standard from
      flannick/dig-gene-set-extractors). No ontology term is asserted as
      class_uri — none resolves to "gene set" (verified against EBI OLS4) — so
      GeneSet grounds via `is_a: Set` (prov:Collection). Represents ONE named
      set of genes. A library of named sets belongs in GeneSetCollection;
      a GMT file is its separate physical serialization.
    annotations:
      dapper:source_standard: dig.geneset 0.1.0 (flannick/dig-gene-set-extractors)
    slots:
      - has_gmt_file
    slot_usage:
      has_gmt_file:
        description: >-
          Reference to a GMT file exporting this single gene set. For a row
          within a shared GMT use in_gmt_file and gmt_entry instead. Accepts File and
          any subclass, including C2M2File. Retrieval locations and checksums
          belong on the referenced file record. In a provenance document, use
          the local file record's content-derived DAPPER identifier (CURIE or
          full URI), not a bare checksum or retrieval URL.
    attributes:
      in_gene_set_collection:
        is_a: relationship
        mixins: [unhashable]  # inverse membership; avoids a collection/member hash cycle
        range: GeneSetCollection
        multivalued: true
        inlined: false
        slot_uri: dapper:inGeneSetCollection
        inverse: members
        description: >-
          Collections containing this GeneSet, independent of its GMT representation.
          A set may belong to several collections. Inverse of GeneSetCollection.members;
          when both directions are supplied in a document they must agree. Optional
          so existing forward-only membership remains valid. Excluded from identity:
          adding a collection backlink does not create a new gene set or a hash cycle.
      in_gmt_file:
        is_a: relationship
        mixins: [unhashable]  # representation locator, independent of the set's content
        range: File
        inlined: false
        slot_uri: dapper:inGmtFile
        description: >-
          File containing the row for this gene set. Reference a local File or
          C2M2File by its DAPPER identifier, paired with gmt_entry. This relation
          locates a representation; it does not assert collection membership or
          contribute to identity. A GMT may therefore contain this set's own ID
          without making that ID depend on the file's checksum.
      gmt_entry:
        is_a: literal
        mixins: [unhashable]  # row selector within a representation
        pattern: '^\S[^\t\r\n]*$'
        description: >-
          Exact first-column name identifying this gene set's row in in_gmt_file.
          This is a row key, not a line number or the human-readable node name.
          Row names must be unique within that GMT representation. May equal this
          GeneSet's id when the GMT uses DAPPER identifiers as row names. Excluded
          from identity so renaming a serialized row does not rename the set.
      assay:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - obo:OBI_0000070      # assay
        description: Assay the gene set derives from (e.g. bulk, sc).
      data_type:
        is_a: literal
        mixins: [hashable]
        description: Molecular data type (e.g. transcriptomics).
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      genome_build:
        is_a: literal
        mixins: [hashable]
        description: Reference genome build (e.g. hg38).
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_members
        minimum_value: 0
        description: Number of distinct genes in this single set, not across a library.
      n_sets:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_sets_emitted
        minimum_value: 1
        maximum_value: 1
        deprecated: Use GeneSetCollection.n_sets for a library; a GeneSet is one set.
        description: Legacy single-set count, if supplied must be 1. Libraries use GeneSetCollection.
      term:
        is_a: literal
        mixins: [hashable]
        description: The term/label a named gene set corresponds to.
      term_prefix:
        is_a: literal
        mixins: [hashable]
        description: Namespace prefix applied to term-derived set names (e.g. HuBMAP).
    rules:
      - preconditions:
          slot_conditions:
            in_gmt_file:
              required: true
        postconditions:
          slot_conditions:
            gmt_entry:
              required: true
      - preconditions:
          slot_conditions:
            gmt_entry:
              required: true
        postconditions:
          slot_conditions:
            in_gmt_file:
              required: true

  GeneSetCollection:
    is_a: Collection
    aliases:
      - gene set library
    description: >-
      A collection of named GeneSet objects, commonly serialized as rows of a
      GMT file. Distinct from an individual gene set and from the physical file.
      Members may be omitted when only a library-level manifest is available;
      when supplied, members enumerates the complete collection.
    slots:
      - has_gmt_file
    slot_usage:
      has_gmt_file:
        description: >-
          File serializing this collection as GMT rows. Use the local File or
          C2M2File record's DAPPER identifier; file location and checksums belong
          on that record. No C2M2 registration is required by this class.
      members:
        range: GeneSet
        inlined: false
        inverse: in_gene_set_collection
        description: >-
          Complete list of GeneSet identifiers, not gene identifiers. The inverse
          link is GeneSet.in_gene_set_collection. Membership contributes to the
          collection's identity; the inverse backlink does not change member IDs.
      member_type:
        ifabsent: string(gene_set)
        equals_string: gene_set
      n_members:
        minimum_value: 0
        description: Number of member GeneSets; when supplied agrees with n_sets.
      was_revision_of:
        range: GeneSetCollection
        description: The previous version of this gene-set library (same collection_key).
    attributes:
      n_sets:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        aliases:
          - n_sets_emitted
        description: Number of distinct named GeneSets in the complete collection.
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        description: >-
          Number of distinct gene identifiers in the union of all member sets.
          A gene in several sets counts once; this is not the sum of row sizes.
      assay:
        is_a: literal
        mixins: [hashable]
        description: Assay context shared by the member gene sets, if applicable.
      data_type:
        is_a: literal
        mixins: [hashable]
        description: Molecular data type shared by the member gene sets.
      organism:
        is_a: literal
        mixins: [hashable]
        description: Organism shared by the member gene sets, if applicable.
      genome_build:
        is_a: literal
        mixins: [hashable]
        description: Genome build shared by the member gene sets, if applicable.
      term_prefix:
        is_a: literal
        mixins: [hashable]
        description: Source naming convention for the GMT row names, not a CURIE declaration.

  # ======================================================================
  # BLOCK — SINGLE-CELL: GENE PROGRAM / CELL STATE. A
  # GeneProgram is a coordinated pattern of gene activity — a factor/module
  # inferred from expression covariance (e.g. cNMF, NMF, Spectra, WGCNA) or a
  # curated gene module — representing a biological process a cell can turn
  # on or off; it extends Set the same way GeneSet does, with genes as
  # members. A CellState is the cellular phenotype defined by which
  # GenePrograms are active in a cell (or cell population) at once —
  # distinct from a cell TYPE (a Cell Ontology class), which is what lineage
  # a cell belongs to rather than what state it is currently in.
  # ======================================================================

  GeneProgram:
    is_a: Set
    aliases:
      - gene program
      - gene expression program
      - GEP
      - metagene
    description: >-
      A Set whose members are genes that co-vary as a coordinated unit and
      together carry out a biological process — a factor from matrix
      factorization (cNMF, NMF, Spectra, WGCNA) or a curated gene module. No
      ontology term is asserted as class_uri — none resolves to "gene
      program" / "gene expression program" (verified against EBI OLS4) — so
      GeneProgram grounds via `is_a: Set` (prov:Collection), the same way
      GeneSet does. Distinct from GeneSet: a GeneSet is typically a static
      annotation (e.g. an MSigDB term); a GeneProgram is inferred from
      expression covariance and is usually a quantitative loading over genes,
      not just membership. `member_weights`, when present, is that loading —
      one number per gene in `members`, positionally paired. A very large
      loading matrix should still reference its source file via the
      member-manifest escape hatch `Set` already provides rather than
      enumerate weights here.
    attributes:
      assay:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - obo:OBI_0000070      # assay
        description: Assay the program was inferred from (e.g. scRNA-seq).
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      inference_method:
        is_a: literal
        mixins: [hashable]
        description: >-
          Method used to derive the program (e.g. cNMF, NMF, Spectra, WGCNA,
          curated).
      biological_process:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          GO biological process CURIE(s) this program represents, e.g.
          `obo:GO_0006629`.
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_members
        description: Count of unique genes in the program.
      member_weights:
        is_a: literal
        mixins: [hashable]
        range: float
        multivalued: true
        aliases:
          - loadings
          - gene_weights
        description: >-
          Quantitative loading/weight for each gene in `members`, positionally
          paired and equal in length to it (`members[i]` <->
          `member_weights[i]`) — e.g. an NMF/cNMF factor loading, or another
          continuous per-gene activity score. Not necessarily raw expression:
          it is whatever per-gene number the `inference_method` produces.
          Reordering or resizing one list without the other breaks the
          pairing.
      quality_score:
        range: GeneProgramQualityScore
        inlined: true
        mixins: [hashable]
        description: >-
          Assessment of this program's overall quality — a composite
          `quality_score` value plus the `components` (stability, confounders,
          validity) it is composited from — see GeneProgramQualityScore.

  GeneProgramQualityScore:
    aliases:
      - gene program quality score
      - GEP quality score
    description: >-
      Assessment of the overall quality of a `GeneProgram`, embedded inline on
      its `quality_score` attribute. One number summarizing how trustworthy a
      program is.
    attributes:
      quality_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Weighted composite of `components`: 20% Stability + 30% Confounders
          + 50% Validity.
      components:
        range: GeneProgramQualityComponents
        inlined: true
        mixins: [hashable]
        description: The three sub-scores `quality_score` is composited from.

  GeneProgramQualityComponents:
    description: >-
      The three independent dimensions assessed for a `GeneProgram`'s quality,
      nested under `GeneProgramQualityScore.components`.
    attributes:
      stability_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Did the method run correctly? Measures reproducibility of gene
          programs across cNMF runs and random seeds. Weighted 20% into
          `quality_score`.
      confounder_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Are there technical confounders masking the biology? Measures
          cross-dataset alignment and agreement — batch effects are one
          example of a confounder. Weighted 30% into `quality_score`.
      validity_score:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0
        maximum_value: 100
        description: >-
          Is the output real biology? Evidence from hallmark pathway
          enrichment, GWAS genetic signals, and cell-surface markers.
          Weighted 50% into `quality_score`.

  CellState:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
    aliases:
      - cellular phenotype
      - cell type state
    description: >-
      A cellular phenotype defined by the combination of GenePrograms active
      in a cell (or cell population) — e.g. "activated", "exhausted",
      "hypoxic". Distinct from a cell TYPE (a Cell Ontology class, e.g.
      `obo:CL_0000542`): a CellState is a functional/transcriptional state a
      cell of a given type can transition into and out of, defined by which
      programs are switched on — not which lineage the cell belongs to. No
      ontology term is asserted as class_uri — no term resolving to "cell
      state" as a generic, cross-cell-type phenotype was found (verified
      against EBI OLS4) — so CellState grounds via `is_a: HashableNode`
      directly. Mixes in `ProvenancedResource` so a CellState is citable and
      attributable the same way a `GeneProgram` (via `Set`) already is.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        description: Free-text description of the cell state.
      cell_type:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Cell Ontology (CL) CURIE of the cell type this state applies to,
          e.g. `obo:CL_0000542`.
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      has_program:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dapper:hasProgram
        description: >-
          GeneProgram id(s) active in this state. The combination of these —
          not any single program — is what defines the state.
      allow_hard_call:
        is_a: literal
        mixins: [hashable]
        range: boolean
        description: Whether this state may be manually called with high confidence despite mixed evidence.
      biological_category:
        is_a: literal
        mixins: [hashable]
        description: High-level biological category this state belongs to.
      biological_description:
        is_a: literal
        mixins: [hashable]
        description: Longer prose description of the state's biology.
      cell_type_id:
        is_a: literal
        mixins: [hashable]
        description: Ontology identifier for the cell type this state applies to.
      cell_type_label:
        is_a: literal
        mixins: [hashable]
        description: Human-readable label for the cell type.
      curation_notes:
        is_a: literal
        mixins: [hashable]
        description: Free-text curator notes on this state.
      curation_version:
        is_a: literal
        mixins: [hashable]
        description: Version of the curation applied to this state.
      disease_context:
        is_a: literal
        mixins: [hashable]
        description: Disease context this state was curated in, if any.
      display_name:
        is_a: literal
        mixins: [hashable]
        description: Human-readable name for portal display.
      display_order:
        is_a: literal
        mixins: [hashable]
        range: integer
        description: Sort order for portal display.
      do_not_overinterpret_as:
        is_a: literal
        mixins: [hashable]
        description: Caveat naming a stronger claim this state should not be read as.
      gene_expression_caveat:
        is_a: literal
        mixins: [hashable]
        description: Caveat about interpreting the underlying gene expression evidence.
      gene_expression_followup:
        is_a: literal
        mixins: [hashable]
        description: Suggested follow-up analysis for the gene expression evidence.
      gene_expression_interpretation:
        is_a: literal
        mixins: [hashable]
        description: Curator's interpretation of the gene expression evidence.
      gene_expression_overinterpretation_warning:
        is_a: literal
        mixins: [hashable]
        description: Warning against overinterpreting the gene expression evidence.
      gene_set_description:
        is_a: literal
        mixins: [hashable]
        description: Description of the gene set(s) underlying this state.
      hard_call_notes:
        is_a: literal
        mixins: [hashable]
        description: Notes justifying a hard (high-confidence) call for this state.
      interpretation_caveat:
        is_a: literal
        mixins: [hashable]
        description: Caveat qualifying the state's interpretation.
      interpretation_status:
        is_a: literal
        mixins: [hashable]
        description: Status of the curator's interpretation (e.g. provisional, confirmed).
      is_composite_required:
        is_a: literal
        mixins: [hashable]
        range: boolean
        description: Whether more than one GeneProgram must be active for this state to hold.
      is_qc:
        is_a: literal
        mixins: [hashable]
        range: boolean
        description: Whether this state represents a quality-control artifact rather than biology.
      known_limitations:
        is_a: literal
        mixins: [hashable]
        description: Known limitations of the evidence supporting this state.
      manual_review_status:
        is_a: literal
        mixins: [hashable]
        description: Status of manual curator review.
      marker_panel_context:
        is_a: literal
        mixins: [hashable]
        description: Marker panel this state was curated against.
      marker_provenance_summary:
        is_a: literal
        mixins: [hashable]
        description: Summary of where the defining markers came from.
      n_markers:
        is_a: literal
        mixins: [hashable]
        range: integer
        description: Count of markers used to define this state.
      negative_checks:
        is_a: literal
        mixins: [hashable]
        description: Checks performed to rule out alternative explanations.
      portal_display_establishment:
        is_a: literal
        mixins: [hashable]
        description: How firmly established this state is, as shown in the portal.
      portal_methods_details:
        is_a: literal
        mixins: [hashable]
        description: Methods details shown for this state in the portal.
      portal_primary_badges:
        is_a: literal
        mixins: [hashable]
        description: Primary badges shown for this state in the portal.
      portal_user_summary:
        is_a: literal
        mixins: [hashable]
        description: User-facing summary of this state shown in the portal.
      portal_visibility:
        is_a: literal
        mixins: [hashable]
        description: Visibility tier controlling whether this state is shown in the portal.
      provenance_warning_count:
        is_a: literal
        mixins: [hashable]
        range: integer
        description: Count of provenance warnings flagged for this state.
      qc_sensitivity:
        is_a: literal
        mixins: [hashable]
        description: Sensitivity of the QC check that flagged this state.
      quality:
        is_a: literal
        mixins: [hashable]
        description: Overall quality tier assigned to this state.
      quality_badges:
        is_a: literal
        mixins: [hashable]
        description: Quality badges shown for this state.
      recommended_portal_label:
        is_a: literal
        mixins: [hashable]
        description: Recommended short label for portal display.
      recommended_portal_summary:
        is_a: literal
        mixins: [hashable]
        description: Recommended summary text for portal display.
      release_class:
        is_a: literal
        mixins: [hashable]
        description: Release classification controlling readiness for publication.
      required_supporting_evidence:
        is_a: literal
        mixins: [hashable]
        description: Evidence required to support this state's call.
      score_scope:
        is_a: literal
        mixins: [hashable]
        description: Scope over which the state's score was computed.
      source_gmt:
        is_a: literal
        mixins: [hashable]
        description: Source .gmt file the underlying gene set was drawn from.
      source_workbook:
        is_a: literal
        mixins: [hashable]
        description: Source spreadsheet/workbook the curation was recorded in.
      state_class:
        is_a: literal
        mixins: [hashable]
        description: Classification of the state (e.g. functional, quality-control).
      state_establishment_level:
        is_a: literal
        mixins: [hashable]
        description: Confidence level at which this state is considered established.
      state_establishment_rationale:
        is_a: literal
        mixins: [hashable]
        description: Rationale for the state's establishment level.
      state_id:
        is_a: literal
        mixins: [hashable]
        description: Identifier for this state in the source curation workbook.
      state_label:
        is_a: literal
        mixins: [hashable]
        description: Short label for this state.
      state_level_citation_ids:
        is_a: literal
        mixins: [hashable]
        description: Citation identifiers supporting this state.
      tissue_id:
        is_a: literal
        mixins: [hashable]
        description: Ontology identifier for the tissue this state was observed in.
      tissue_label:
        is_a: literal
        mixins: [hashable]
        description: Human-readable label for the tissue.

  # ======================================================================
  # BLOCK — AGENTIC REPLAY. `AgenticWorkspace` is the workspace and prompt
  # an AI agent can use to re-run an Activity, alongside the machine replay
  # path (`command` / `container_image` / `code_version`) rather than
  # instead of it — a prompt is not a deterministic replay mechanism.
  # ======================================================================

  AgenticWorkspace:
    is_a: HashableNode
    class_uri: prov:Plan
    description: >-
      A workspace in which an AI agent can re-run an Activity, plus the prompt
      that asks it to. This is the agentic counterpart of the executable
      provenance an Activity already carries: `command` and `container_image`
      tell a machine how to replay a step, while `regeneration_prompt` and
      `workspace_url` tell an agent how to.

      It is typed `prov:Plan` because that is what it is in PROV terms — a
      description of intended execution, not the execution itself. The run
      remains the Activity; this is the recipe the agent follows. Keeping them
      separate matters: re-running a plan produces a NEW Activity, and
      conflating the two would make a regenerated result indistinguishable from
      the original.

      WARNING ON REPRODUCIBILITY. A prompt is not a deterministic replay
      mechanism. The same prompt, workspace, and model can yield a different
      result run to run. Treat `regeneration_prompt` as documentation of intent
      that a human or agent can act on, NOT as a guarantee of bit-identical
      output — that is what `command` plus `container_image` plus
      `code_version` are for. Record the model and version actually used so a
      divergent re-run can at least be explained.
    attributes:
      workspace_url:
        is_a: literal
        mixins: [unhashable]  # environmental
        range: uri
        slot_uri: schema:url
        description: >-
          Resolvable URL for the workspace — where a person or agent goes to
          open it. In the example of akleao this is a fork URL,
          `https://www.akleao.com/fork/<slug-id>`: one shareable link that
          opens the workspace, rather than a path through project and branch
          ids. Required in spirit: a workspace nobody can reach is not
          provenance, it is a note.
      workspace_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The hosting platform's own identifier for the workspace, when it
          differs from this node's `id` — for an akleao fork, the slug in its
          URL.
      platform:
        is_a: literal
        mixins: [unhashable]  # environmental
        description: >-
          The system hosting the workspace, e.g. "akleao", "Claude Code".
      regeneration_prompt:
        is_a: literal
        mixins: [hashable]
        description: >-
          The prompt that asks an agent to regenerate this analysis. Write it
          self-contained: an agent opening the workspace cold should be able to
          act on it without the surrounding conversation.
      agent_model:
        is_a: literal
        mixins: [hashable]
        description: >-
          Model that ran, or is expected to run, the prompt (e.g.
          "claude-fable-5"). Recorded so a divergent re-run can be explained.
      agent_role:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The software agent acting in this workspace — an npx:SoftwareAgent,
          which is also how a nanopublication attributes an assertion to a
          non-human author.
        close_mappings:
          - prov:wasAssociatedWith
      last_run:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        description: When the prompt was last executed in this workspace.

  # ======================================================================
  # BLOCK — CFDE C2M2. A File specialized with C2M2 identifiers.
  # ======================================================================

  C2M2File:
    is_a: File
    mixins:
      - PortalLinked
    exact_mappings:
      - dcat:Distribution
    close_mappings:
      - schema:DataDownload
    aliases:
      - C2M2 file
    description: >-
      A File described by CFDE C2M2 (Crosscut Metadata Model) properties in a
      dig.geneset provenance graph. Inherits generic file metadata from File;
      adds C2M2 identifiers and portal links. C2M2 is a tabular metadata model
      with no RDF vocabulary, so this class carries no C2M2 class_uri — it is
      grounded in DCAT/schema.org, with the C2M2 field names preserved as
      attribute names and dapper:source_standard annotations.
    annotations:
      dapper:source_standard: CFDE C2M2 file
    slot_usage:
      filename:
        annotations:
          dapper:source_standard: C2M2 filename
      md5:
        annotations:
          dapper:source_standard: C2M2 md5
      sha256:
        annotations:
          dapper:source_standard: dig.geneset input.files[].sha256
      size_in_bytes:
        annotations:
          dapper:source_standard: C2M2 size_in_bytes
    attributes:
      persistent_id:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - DataCite:hasIdentifier
        annotations:
          dapper:source_standard: C2M2 persistent_id
        description: C2M2 persistent identifier (UUID).
      local_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        annotations:
          dapper:source_standard: C2M2 local_id
        description: >-
          Source-assigned identifier retained from a C2M2 record, represented
          here as a URI or CURIE. Put current storage paths in inherited
          location instead. Native C2M2 local_id suffixes require their source
          namespace to form this reference; this profile does not model that
          two-column key separately.
      c2m2_uuid:
        is_a: literal
        mixins: [hashable]
        aliases:
          - _uuid
        annotations:
          dapper:source_standard: C2M2 _uuid
        description: Internal C2M2 UUID for the file node.

# ===========================================================================
# BLOCK — DISMECH HARMONIZATION
#
# DISMECH (https://w3id.org/monarch-initiative/dismech) is mirrored into this
# repo VERBATIM from monarch-initiative/dismech and is refreshed by
# models/dismech/pull_dismech.py. It is therefore NOT editable here: any local
# change is silently reverted on the next refresh. All harmonization is
# expressed on THIS side, as mappings and pointers, so both models can evolve
# independently and still line up.
#
# Cross-walk summary (DAPPER <-> DISMECH):
#   dapper:Dataset             <-> dismech:Dataset            (complementary halves:
#                                DISMECH describes the science of a dataset,
#                                DAPPER describes its attribution)
#   dapper:Publication         <-> dismech:PublicationReference
#   dapper:Activity            <-> dismech:CurationEvent      (DISMECH's homegrown
#                                mini-PROV; DAPPER's PROV-O subsumes it)
#   dapper:MechanisticModel    ~   dismech:MechanisticHypothesis
#   dapper:CausalStep          <-> dismech:CausalEdge
#   dapper:Mechanism           <-> dismech:Mechanism
#   dapper:EvidenceItem        <-> dismech:EvidenceItem
#
# NOTE ON IDENTITY. DISMECH keys a disease by `Disease.name` (a plain string)
# and a dataset by `accession` (a CURIE). DAPPER keys every Node by a
# CURIE/URI `id`. When pointing at a DISMECH entry, prefer the ontology term
# (MONDO CURIE) it carries in `disease_term`, and record the upstream string
# key separately in `dismech_entry_key` so the join is lossless in both
# directions.
# ===========================================================================

# ===========================================================================
# BLOCK — NANOPUBLICATION (Nanodash / Knowledge Pixels)
#
# A nanopublication is FOUR NAMED GRAPHS, not one document:
#
#   <np>/Head         np:Nanopublication, and the three functional links:
#                     np:hasAssertion / np:hasProvenance / np:hasPublicationInfo
#   <np>/assertion    the claim itself                     (np:Assertion)
#   <np>/provenance   where the ASSERTION came from        (np:Provenance)
#   <np>/pubinfo      where the NANOPUB came from + sig    (np:PublicationInfo)
#
# LinkML has no named-graph construct, so each graph is modelled here as a
# class and the graph it belongs in is recorded as `dapper:np_graph` on that
# class. A serializer walks these annotations to emit TriG/JSON-LD quads; a
# loader reverses it. Class/slot URIs below are quoted from the live ontology
# documents at http://www.nanopub.org/nschema and http://purl.org/nanopub/x/.
#
# WHY THIS FITS DAPPER. The nanopub split is almost exactly the DAPPER
# split, which is why the two compose instead of competing:
#   assertion   <- the scientific claim        (Claim, claims.yaml)
#   provenance  <- prov:wasAttributedTo, Activity, LineageStep
#   pubinfo     <- creator / license / created / RecommendedCitation
# So `ProvenancedResource` already carries most of what the provenance and
# pubinfo graphs need; the nanopub classes below mostly add IDENTITY (trusty
# URIs), SIGNATURE, and LIFECYCLE.
#
# TRUSTY URIs. A published nanopub's `id` is a trusty URI — the base URI with
# a cryptographic hash of the content (e.g.
# https://w3id.org/np/RAwUp0SmZZwQNOY1zbSPhR21aQoImiUyQrDlyXj5QYXmQ). It is
# therefore CONTENT-ADDRESSED AND IMMUTABLE: you never edit a nanopub, you
# publish a new one that npx:supersedes it. This is a strictly stronger form
# of the mirroring invariant above, and worth calling out explicitly — a signed
# trusty URI makes "a mirror MUST NOT rewrite authoritative provenance"
# cryptographically checkable rather than merely stated.
# ===========================================================================

  Nanopublication:
    is_a: HashableNode
    class_uri: np:Nanopublication
    description: >-
      A nanopublication: an assertion plus its provenance plus its publication
      info, published as one signed, content-addressed unit. All THREE of
      `has_assertion`, `has_provenance` and `has_publication_info` are required
      — the well-formedness rules demand exactly one quad for each, so a nanopub
      with only an assertion is malformed and the network will reject it. `id` is the
      nanopub's trusty URI once published (a draft may use a temporary URI).
    annotations:
      dapper:np_graph: Head
      dapper:source_standard: Nanopublication schema (http://www.nanopub.org/nschema)
    attributes:
      has_assertion:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasAssertion
        description: >-
          The assertion graph. REQUIRED: nanopublication well-formedness demands
          exactly one `np:hasAssertion` quad in the Head.
        annotations:
          dapper:np_graph: Head
      has_provenance:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasProvenance
        description: >-
          The provenance graph — where the ASSERTION came from (not where the
          nanopub came from; that is pubinfo). REQUIRED: exactly one, same as
          the assertion. A nanopub carrying only an assertion is malformed.
        annotations:
          dapper:np_graph: Head
      has_publication_info:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasPublicationInfo
        description: >-
          The publication-info graph — where the NANOPUB itself came from.
          REQUIRED: exactly one.
        annotations:
          dapper:np_graph: Head
      nanopub_type:
        is_a: literal
        mixins: [hashable]
        range: NanopubTypeEnum
        multivalued: true
        slot_uri: npx:hasNanopubType
        annotations:
          dapper:np_graph: pubinfo
        description: Type(s) classifying this nanopublication (e.g. draft_nanopub).
      has_signature_element:
        is_a: relationship
        mixins: [unhashable]  # signature
        range: uriorcurie
        slot_uri: npx:hasSignatureElement
        description: The NanopubSignature covering this nanopub.
        annotations:
          dapper:np_graph: pubinfo
      supersedes:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:supersedes
        description: >-
          A previously published nanopub this one replaces. Because trusty URIs
          are immutable, this — not editing — is how a nanopub is updated.
        annotations:
          dapper:np_graph: pubinfo
      invalidates:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: npx:invalidates
        annotations:
          dapper:np_graph: pubinfo
        description: Nanopublication(s) this one invalidates without formally superseding them.
      was_created_at:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:wasCreatedAt
        description: >-
          The service that minted this nanopub, e.g.
          https://nanodash.knowledgepixels.com/.
        annotations:
          dapper:np_graph: pubinfo
      created_from_template:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: ntemplate:wasCreatedFromTemplate
        description: >-
          The Nanodash template this nanopub was instantiated from. Knowledge
          Pixels tooling emits this alongside
          `ntemplate:wasCreatedFromProvenanceTemplate` and
          `...FromPubinfoTemplate`.
        annotations:
          dapper:np_graph: pubinfo
      created:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        slot_uri: dcterms:created
        annotations:
          dapper:np_graph: pubinfo
        description: When the nanopublication was created.
      creator:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:creator
        description: ORCID(s) of the nanopub's creator.
        annotations:
          dapper:np_graph: pubinfo
      nanopub_license:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:license
        annotations:
          dapper:np_graph: pubinfo
        description: License CURIE/URI the nanopublication is released under.
      label:
        is_a: literal
        mixins: [hashable]
        slot_uri: rdfs:label
        annotations:
          dapper:np_graph: pubinfo
        description: Human-readable label for the nanopublication.
      trusty_uri:
        is_a: literal
        mixins: [unhashable]   # assigned after the content exists
        range: uri
        description: >-
          The real Trusty URI (an `RA…` artifact code) minted by nanopub-java
          when this nanopublication is actually published. NOT computed by
          identity — see docs/guides/trusty-identifiers.md, which is explicit
          that `RA` must not be reimplemented or approximated.

          Distinct from `id`, which is this repository's own
          `dapper:Nanopublication.{digest}` content address. Two identifiers,
          two different guarantees: keep them separate and never conflate them.
        annotations:
          dapper:np_graph: Head

  NanopubAssertion:
    is_a: HashableNode
    class_uri: np:Assertion
    description: >-
      The assertion graph — the claim being made, and the only part a reader is
      asked to believe. `asserts` points at a Claim or ScientificAccount. The assertion graph is distinct from
      the scientific object it carries.
    annotations:
      dapper:np_graph: assertion
    attributes:
      asserts:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: hycl:claims
        description: >-
          The scientific object carried by this graph: a Claim or ScientificAccount id.
      as_sentence:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:asSentence
        description: >-
          An English rendering of the assertion. When it is a single
          self-contained sentence with an unambiguous subject, this is an
          AIDA sentence (hycl:AIDA-Sentence).
        close_mappings:
          - hycl:AIDA-Sentence

  NanopubProvenance:
    is_a: HashableNode
    class_uri: np:Provenance
    description: >-
      The provenance graph — where the ASSERTION came from (not where the
      nanopub came from; that is pubinfo). Its subject is the assertion graph.
      This is the natural home for a DAPPER `Activity` / `LineageStep` chain.
    annotations:
      dapper:np_graph: provenance
    attributes:
      provenance_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The assertion graph this provenance describes.
      was_attributed_to:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasAttributedTo
        description: >-
          Agent the assertion is attributed to — an ORCID for a person, or an
          npx:SoftwareAgent / npx:SoftwareTool for a generating pipeline such
          as REVEAL.
      generated_by_activity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: prov:wasGeneratedBy
        description: DAPPER Activity id that produced the assertion.
      derived_from:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasDerivedFrom
        description: >-
          Source entities the assertion was derived from — Dataset, GeneSet, or
          Publication ids.

  NanopubPublicationInfo:
    is_a: HashableNode
    class_uri: np:PublicationInfo
    description: >-
      The publication-info graph — metadata about the NANOPUB itself: who
      published it, when, under what licence, with what signature. Overlaps
      almost exactly with the DAPPER attribution core.
    annotations:
      dapper:np_graph: pubinfo
    attributes:
      pubinfo_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The nanopub this publication info describes.

  NanopubSignature:
    is_a: HashableNode
    class_uri: npx:NanopubSignatureElement
    description: >-
      The cryptographic signature over a nanopublication. Published nanopubs in
      the Knowledge Pixels network are RSA-signed and keyed to the signer's
      ORCID; verifying the signature plus recomputing the trusty-URI hash
      proves the content has not been altered since publication.
    annotations:
      dapper:np_graph: pubinfo
      dapper:mirror_mutable: false
    attributes:
      has_algorithm:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasAlgorithm
        description: Signature algorithm, e.g. "RSA".
      has_public_key:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasPublicKey
        description: Base64 public key of the signer.
      has_signature:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasSignature
        description: Base64 signature value.
      signed_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:signedBy
        description: Agent that signed — an ORCID.
      has_signature_target:
        is_a: relationship
        mixins: [unhashable]  # signature + back-reference
        range: uriorcurie
        slot_uri: npx:hasSignatureTarget
        description: The nanopub this signature covers.

  # ---- nanopub edges -------------------------------------------------------

  HasAssertion:
    is_a: Edge
    description: Nanopublication → NanopubAssertion.
    slot_usage:
      predicate:
        ifabsent: string(np:hasAssertion)

  HasProvenanceGraph:
    is_a: Edge
    description: Nanopublication → NanopubProvenance.
    slot_usage:
      predicate:
        ifabsent: string(np:hasProvenance)

  HasPublicationInfo:
    is_a: Edge
    description: Nanopublication → NanopubPublicationInfo.
    slot_usage:
      predicate:
        ifabsent: string(np:hasPublicationInfo)

  Supersedes:
    is_a: Edge
    description: >-
      Nanopublication → Nanopublication. The update mechanism for immutable
      trusty-URI artifacts.
    slot_usage:
      predicate:
        ifabsent: string(npx:supersedes)

# ===========================================================================
# BLOCK — HYPOTHESIS (the REVEAL output)
#
# Mechanistic structure is optional content. Hypothesis is a Proposition's
# role in a ScientificAccount; attribution and assessment live on Claim.
# DISMECH alignments here are conceptual, not assertions of complete equivalence.

  MechanisticModel:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - DismechLinked
    description: >-
      Optional biological model elaborating one or more causal relationships.
      Contains structure and scope, not an assessment, confidence, or review
      status. A Proposition may reference this model and Claims assess that
      proposition. Its use as a hypothesis belongs to a ScientificAccount.
    close_mappings:
      - dismech:MechanisticHypothesis
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        required: true
        description: Description of the proposed biological structure.
      subject_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Optional upstream entity in the mechanistic model.
      object_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Optional downstream entity in the mechanistic model.
      has_causal_step:
        is_a: relationship
        mixins: [hashable]
        range: CausalStep
        inlined: false
        multivalued: true
        description: Causal steps, ordered by each step's step_index.
      scope:
        is_a: literal
        mixins: [hashable]
        description: Biological conditions under which the model is proposed to apply.
      applies_to_subtypes:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Disease subtypes to which this model applies.

  CausalStep:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      One ordered link in a mechanistic model's causal chain: subject -> object, with
      a directness classification and optional intermediates. Deliberately
      shaped as DISMECH's `CausalEdge` so a chain can be written into a DISMECH
      entry, or read out of one, without translation.
    exact_mappings:
      - dismech:CausalEdge
    annotations:
      dapper:source_standard: DISMECH CausalEdge
    attributes:
      step_index:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        description: >-
          0-based position in the chain. Carries the ordering explicitly
          because RDF graphs are unordered.
      step_subject:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Upstream end of this step (gene, variant, mechanism, phenotype, ...).
      step_object:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Downstream end of this step. Corresponds to DISMECH `CausalEdge.target`.
        exact_mappings:
          - dismech:target
      causal_link_type:
        is_a: literal
        mixins: [hashable]
        range: CausalLinkTypeEnum
        description: >-
          Directness of the step. Values are DISMECH's verbatim.
        exact_mappings:
          - dismech:causal_link_type
      intermediate_mechanisms:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: >-
          Known intervening mechanisms, required in spirit when
          `causal_link_type` is INDIRECT_KNOWN_INTERMEDIATES.
        exact_mappings:
          - dismech:intermediate_mechanisms
      via_mechanism:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: Mechanism node ids for this step (structured counterpart of the above).
      description:
        is_a: literal
        mixins: [hashable]
  Mechanism:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      A biological mechanism invoked by a causal step. Intentionally thin —
      DISMECH's `Mechanism` is `name` + `description`, and the rich
      pathophysiology (cell types, biological processes, pathways, locations)
      lives upstream in DISMECH's `Pathophysiology`. Point at it with
      `DismechLinked` rather than copying it here.
    exact_mappings:
      - dismech:Mechanism
    close_mappings:
      - dismech:Pathophysiology
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
      biological_process:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: GO biological process CURIE(s), e.g. `obo:GO_0006629`.

  EvidenceItem:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
    description: >-
      Evidence used in an attributed assessment of a target proposition.
      Can retain a publication passage, use source Claims, or ground directly
      in result-file values via value_locators, with a direction, rationale,
      and assumptions. At least one grounding (source_claims, value_locators,
      reference, or snippet) should be present. The target is a Proposition
      rather than the owning Claim, so Claim -> EvidenceItem -> Proposition has
      no back-reference cycle. Reuse across Claims requires the same target and
      interpretation.
    close_mappings:
      - dismech:EvidenceItem
    see_also:
      - https://sepio-framework.github.io/sepio-linkml/EvidenceLine/
    annotations:
      dapper:source_standard: DISMECH EvidenceItem and SEPIO EvidenceLine (conceptual alignment)
    attributes:
      source_claims:
        is_a: relationship
        mixins: [hashable]
        range: Claim
        inlined: false
        multivalued: true
        description: >-
          Source assessments used as evidence; not automatically accepted as
          true. Optional since 0.3.0-a1, so evidence read directly from a
          result file can ground in value_locators without a synthetic
          intermediate claim.
      value_locators:
        slot_uri: dapper:value_locators
        is_a: relationship
        mixins: [hashable]
        range: ValueLocator
        inlined: false
        multivalued: true
        description: >-
          Exact file spans grounding this evidence at the result-file boundary;
          the preferred grounding for evidence read directly from a result
          file. Added in 0.3.0-a1.
      target_proposition:
        is_a: relationship
        mixins: [hashable]
        range: Proposition
        inlined: false
        description: Proposition to which direction and explanation apply.
      context:
        is_a: literal
        mixins: [hashable]
        description: Analytical or biological model context needed to interpret this evidence use.
      assumptions:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Assumptions licensing this interpretation; not claims assessed by this work.
      mechanistic_model:
        is_a: relationship
        mixins: [hashable]
        range: MechanisticModel
        inlined: false
        description: Optional biological structure used in the interpretation.
      reference:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The publication this evidence comes from — a Publication node id, or
          a `PMID:` CURIE.
        exact_mappings:
          - dismech:reference
      reference_title:
        is_a: literal
        mixins: [hashable]
        exact_mappings:
          - dismech:reference_title
        description: Title of the referenced publication.
      direction:
        is_a: literal
        mixins: [hashable]
        range: EvidenceDirectionEnum
        description: Direction of this evidence use relative to target_proposition.
        close_mappings:
          - dismech:supports
      evidence_source:
        is_a: literal
        mixins: [hashable]
        description: Where the evidence was drawn from (database, deep-research run, ...).
        exact_mappings:
          - dismech:evidence_source
      snippet:
        is_a: literal
        mixins: [hashable]
        description: Verbatim quoted passage supporting the claim.
        exact_mappings:
          - dismech:snippet
      explanation:
        is_a: literal
        mixins: [hashable]
        description: Curator/agent rationale for how the passage or source claims bear on the target proposition.
        exact_mappings:
          - dismech:explanation
      from_nanopub:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The nanopublication this evidence is drawn from, when the evidence is
          itself a published, signed claim rather than a passage from a paper.
          Following it reaches that claim's own provenance graph, and from
          there the analysis and dataset it rests on.

    rules:
      - preconditions:
          slot_conditions:
            source_claims:
              required: true
        postconditions:
          slot_conditions:
            target_proposition:
              required: true
            direction:
              required: true
            explanation:
              required: true
            context:
              required: true
      # Evidence read from a file must still say what it bears on and how.
      # Direction stays optional: a raw measurement supplies none, and DAPPER
      # does not infer one by thresholding a value without a declared rule.
      - preconditions:
          slot_conditions:
            value_locators:
              required: true
        postconditions:
          slot_conditions:
            target_proposition:
              required: true
            explanation:
              required: true

  # ---- scientific-content edges ----------------------------------------------------

  HasCausalStep:
    is_a: Edge
    description: MechanisticModel → CausalStep.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasCausalStep)

  HasEvidence:
    is_a: Edge
    description: Claim → EvidenceItem.
    slot_usage:
      predicate:
        ifabsent: string(dapper:hasEvidence)

  AssertedIn:
    is_a: Edge
    description: >-
      Claim → Nanopublication. Records that this claim was published in a
      signed, content-addressed nanopublication.
    slot_usage:
      predicate:
        ifabsent: string(hycl:claims)

  HasAgenticWorkspace:
    is_a: Edge
    description: >-
      Activity → AgenticWorkspace. Reified form of
      `Activity.has_agentic_workspace`: the workspace and prompt from which
      this analysis can be re-run by an agent.
    slot_usage:
      subject:
        description: Activity id.
      predicate:
        ifabsent: string(dapper:hasAgenticWorkspace)
      object:
        description: AgenticWorkspace id.

  CorrespondsToDismech:
    is_a: Edge
    description: >-
      Any DAPPER node → the DISMECH entry it corresponds to. The instance-
      level counterpart of the class-level `exact_mappings` in block (A).
    slot_usage:
      subject:
        description: DAPPER node id.
      predicate:
        ifabsent: string(skos:closeMatch)
      object:
        description: DISMECH entry identifier (prefer the MONDO CURIE).
