id: https://broadinstitute.github.io/dapper/model/schema/dapper.yaml
name: dapper
title: DAPPER - NIH Dataset Attribution and Provenance Profile
description: >-
  A LinkML data model for DAPPER, the NIH Dataset Attribution and Provenance
  Profile. Every dataset returned through an NIH MCP server should carry
  enough structured metadata for an AI system to cite the dataset, identify its
  creators, link to the primary publication, report the NIH grant/award that
  supported it, and describe the provenance of the returned result.

  This is the profile's entry point. It defines no classes of its own; it
  imports the modules below, and tools and validation start here.

    core.yaml. What is tracked: the knowledge-graph skeleton, identity,
      citation/funding/provenance (JSON-LD + DataCite + PROV-O + schema.org),
      GA4GH DRS, DUO, RO-Crate, BioCompute/IEEE-2791, embeddings, versioned
      collections (`Collection`, `ResultCollection`) and `ValueLocator`.

    claims.yaml. Scientific reasoning: `Proposition`, `Claim` and its scores,
      `EvidenceItem`, `Question` and `KnowledgeGap`, `ScientificAccount`,
      `Paragraph`, and the abstract `ExplanatoryModel` that domain models
      specialize. Conceptually aligned with SEPIO's Proposition and
      Statement model.

    genesets.yaml. `GeneSet` and `GeneSetCollection` (dig.geneset).

    cell_programs.yaml. `GeneProgram` and `CellState`.

    mechanisms.yaml. `MechanisticModel` (an `ExplanatoryModel`), `CausalStep`
      and `Mechanism`.

    nanopub.yaml. The nanopublication quad, signature and lifecycle.

    dismech.yaml. `CorrespondsToDismech`, the instance-level DISMECH
      cross-walk.

    replay.yaml. `AgenticWorkspace`, the agentic replay path for an Activity.

    cfde.yaml. `C2M2File`, a File with CFDE C2M2 identifiers.

  The schema is shaped as a Dock knowledge graph: NIH resources, agents,
  awards, publications, scientific accounts, and nanopublications are Node entities;
  attribution, provenance, and causal assertions are Edge relationships.
license: https://opensource.org/license/mit
version: 0.3.0-a1

default_prefix: dapper
default_range: string

# Shared prefixes (and the prefix policy) are declared in core.yaml; each
# module declares the ones its own terms use.
prefixes:
  dapper: https://broadinstitute.github.io/dapper/ns#
  dapper_class: https://broadinstitute.github.io/dapper/model/reference/classes/
  dapper_slot: https://broadinstitute.github.io/dapper/model/reference/slots/
  dapper_enum: https://broadinstitute.github.io/dapper/model/reference/enums/
  dapper_type: https://broadinstitute.github.io/dapper/model/reference/types/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - core
  - claims
  - genesets
  - cell_programs
  - mechanisms
  - nanopub
  - dismech
  - replay
  - cfde
