# Lint every module on its own: linkml-lint checks only the elements of the
# schema it is given, not those of its imports, so dapper.yaml (imports only)
# covers nothing by itself.
#   for f in schema/*.yaml; do uv run --with linkml linkml-lint -c .linkml-lint.yaml "$f"; done
rules:
  recommended:
    level: warning
  no_xsd_int_type:
    level: error
  no_invalid_slot_usage:
    level: error
  no_undeclared_slots:
    level: error
  no_undeclared_ranges:
    level: error
  one_identifier_per_class:
    level: error
  one_key_per_class:
    level: error
  root_type_checks:
    level: error
  standard_naming:
    level: warning
    # CausalLinkTypeEnum's values (schema/claims.yaml) match DISMECH's
    # causal_link_type values, so a projection copies them unchanged.
    exclude:
      - DIRECT
      - INDIRECT_KNOWN_INTERMEDIATES
      - INDIRECT_UNKNOWN_INTERMEDIATES
      - UNKNOWN
      # DIG ancestry folder codes round-trip without changing case.
      - AA
      - AF
      - EA
      - EU
      - GME
      - HS
      - Mixed
      - SA
      - SSAF
      # claims.yaml enum values predate per-module linting and appear in
      # minted records; renaming them would change identifiers.
      - KNOWLEDGE_GAP
      - HUMAN_MODEL_MISMATCH
      - SUPPORTS
      - DISPUTES
      - NEUTRAL
      - MIXED
      - PROBABILITY
      - POSTERIOR_PROBABILITY
      - EFFECT_ESTIMATE
      - LOADING
      - SCORE
      - RESULT
      - BIOLOGICAL_INTERPRETATION
      - UNSPECIFIED
      # Causal vocabularies added in 0.3.0-a1, in the same style.
      - ASSOCIATION
      - PREDICTION
      - MEASUREMENT
      - CONSTITUTION
      - CAUSATION
      - INCREASES
      - DECREASES
      - CHANGES
      - EXPERIMENTAL_INTERVENTION
      - NATURAL_EXPERIMENT
      - OBSERVATIONAL
      - MECHANISTIC
      - COMPUTATIONAL
      - ACTIVITY
      - ABUNDANCE
      - EXPRESSION
      - LOCALIZATION
      - STRUCTURE
      - RATE
      - PRESENCE
      - SEVERITY
      - CAUSES
      - CONTRIBUTES_TO
      - ENABLES
      - REGULATES
  canonical_prefixes:
    level: warning
