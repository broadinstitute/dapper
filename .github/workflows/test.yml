name: Tests

# Runs on PULL REQUESTS, which is the gap this closes: pages.yml only fires on
# push to main, so until now nothing was checked until after a merge. Two of the
# bugs found while integrating #4/#6/#13 — a stale set of identifiers in
# example_bottom_line_result.yaml, and a stale BioComputeObject id in
# example_graph.yaml that no check covered — would both have been caught here.
#
# The same three checks pages.yml runs are repeated, so a red PR means the
# deploy would have failed too, rather than finding out on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The code under test is a set of standalone PEP-723 scripts, so there is
      # nothing to `pip install -e`; uv assembles pytest plus the scripts' own
      # declared dependencies from tests/requirements.txt.
      - name: Unit tests
        run: uv run --with-requirements tests/requirements.txt pytest tests/ -q

      - name: Fail if the committed portal is stale
        run: uv run portal/build.py --check

      - name: Check identity invariants
        run: uv run schema/identity/lint_identity.py

      - name: Replay identifier test vectors
        run: uv run schema/identity/dapper_identity.py verify-vectors
