name: Deploy portal and model documentation to Pages

# Publishes site/ to https://broadinstitute.github.io/dapper/:
# the provenance inspector at the root, generated LinkML docs under /model/.
#
# `build.py --check` is the guard that matters: it regenerates index.html from
# schema/dapper.yaml plus the examples and fails if the committed copy differs.
# Without it a stale portal could be published showing identifiers that no
# longer match the schema it claims to render.

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "schema/**"
      - "docs/**"
      - "tools/build_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fail if the committed portal is stale
        run: uv run portal/build.py --check

      - name: Check identity invariants
        run: uv run schema/identity/lint_identity.py

      - name: Replay identifier test vectors
        run: uv run schema/identity/dapper_identity.py verify-vectors

      - name: Build model documentation and combined site
        run: uv run tools/build_docs.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: verify-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
