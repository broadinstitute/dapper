repos:
  - repo: local
    hooks:
      - id: linkml-lint
        name: linkml-lint (no warnings)
        entry: uv run --with linkml linkml-lint -c schema/.linkml-lint.yaml schema/dapper.yaml
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --with-requirements tests/requirements.txt pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
