repos:
  - repo: local
    hooks:
      - id: linkml-lint
        name: linkml-lint (no warnings)
        # Every module is linted alone: linkml-lint checks only the given
        # schema's own elements, and each module must stay importable without
        # dapper.yaml (which only imports the others).
        entry: bash -c 'for f in schema/*.yaml; do linkml-lint -c .linkml-lint.yaml "$f" || exit 1; done'
        language: python
        additional_dependencies: [linkml]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: pytest tests/ -q
        language: python
        additional_dependencies: [pytest>=8, pyyaml, rdflib, linkml-runtime, ruamel.yaml, linkml==1.11.1, jsonschema]
        pass_filenames: false
        always_run: true
