repos:
  - repo: local
    hooks:
      - id: linkml-lint
        name: linkml-lint (no warnings)
        # core.yaml is linted alone too, so it stays importable without dapper.yaml.
        entry: bash -c 'linkml-lint -c .linkml-lint.yaml schema/dapper.yaml && linkml-lint -c .linkml-lint.yaml schema/core.yaml'
        language: python
        additional_dependencies: [linkml]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: pytest tests/ -q
        language: python
        additional_dependencies: [pytest>=8, pyyaml, rdflib, linkml-runtime, ruamel.yaml, linkml==1.11.1, jsonschema]
        pass_filenames: false
        always_run: true
